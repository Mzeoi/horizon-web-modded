<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body > canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ddd; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px;
    pointer-events: none; white-space: pre-line;
  }
  #status:empty { display: none; }
  #corner-ui {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    font: 12px/1.4 system-ui, -apple-system, sans-serif; color: #e6e8ec;
  }
  .ui-btn {
    background: rgba(18, 22, 30, 0.88); color: #e6e8ec;
    border: 1px solid #3c4454; border-radius: 5px;
    padding: 6px 12px; cursor: pointer; font: inherit; font-weight: 500;
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  .ui-btn:hover:not(:disabled) { background: rgba(34, 41, 56, 0.96); border-color: #556075; }
  .ui-btn:active:not(:disabled) { transform: translateY(0.5px); }
  .ui-btn:focus-visible { outline: 2px solid #5ea377; outline-offset: 1px; }
  .ui-btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .ui-btn.primary {
    background: #2f5e40; border-color: #4d8a63; color: #fff;
  }
  .ui-btn.primary:hover:not(:disabled) { background: #38704c; border-color: #5ea377; }
  .ui-btn.ghost {
    background: rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.08); color: #9aa5b8;
  }
  .ui-btn.ghost:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.14); color: #e6e8ec;
  }
  #mods-toggle, #file-toggle { min-width: 66px; text-align: center; }
  .ui-panel {
    display: none; padding: 14px; width: 256px; box-sizing: border-box;
    background: rgba(16, 20, 28, 0.94); border: 1px solid #3c4454;
    border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
  }
  .ui-panel.open { display: block; }
  .panel-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: #9aa5b8;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  #mods-panel label {
    display: flex; align-items: center; gap: 8px;
    margin: 7px 0; cursor: pointer; color: #dce1eb;
  }
  #mods-panel input[type="checkbox"] { accent-color: #4d8a63; margin: 0; }
  #mods-note { display: none; margin-top: 8px; font-size: 11px; color: #f6c453; }
  #mods-reload { display: none; margin-top: 8px; width: 100%; }

  .file-label { font-size: 11px; color: #9aa5b8; margin-bottom: 5px; }
  .file-path-box {
    padding: 6px 8px; margin-bottom: 10px;
    background: rgba(10, 12, 16, 0.78); border: 1px solid #2e3543; border-radius: 5px;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfd6e4; word-break: break-all;
  }
  .file-sync-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 12px; color: #dce1eb;
  }
  .file-input {
    width: 68px; padding: 4px 6px; box-sizing: border-box; text-align: right;
    background: rgba(10, 12, 16, 0.88); color: #e6e8ec;
    border: 1px solid #3c4454; border-radius: 5px; font: inherit;
  }
  .file-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  #file-connect { grid-column: 1 / -1; }
  #file-status {
    margin-top: 10px; font-size: 11px; line-height: 1.4; color: #8cb4ff;
  }
  #file-status:empty { display: none; }

  #fs-overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(0, 0, 0, 0.24);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    font: 13px/1.5 system-ui, -apple-system, sans-serif; color: #e6e8ec;
  }
  #fs-overlay.open { display: flex; }
  #fs-modal {
    width: 360px; max-width: calc(100vw - 32px); padding: 22px 24px; box-sizing: border-box;
    background: rgba(16, 20, 28, 0.68);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px; box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
  }
  .fs-modal-title {
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    color: #fff; margin-bottom: 8px;
  }
  #fs-modal p {
    margin: 0 0 16px; font-size: 13px; line-height: 1.55; color: #b8c2d4;
  }
  #fs-overlay-msg {
    margin: 0 0 14px; padding: 8px 10px; border-radius: 5px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 12px; line-height: 1.45; color: #7ee787;
  }
  #fs-overlay-msg:empty { display: none; }
  .fs-modal-actions { display: flex; flex-direction: column; gap: 8px; }
  #fs-overlay-connect { padding: 8px 14px; font-size: 13px; }
  .fs-modal-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<div id="status">Starting…</div>
<div id="corner-ui">
  <button id="mods-toggle" class="ui-btn" type="button">Mods</button>
  <div id="mods-panel" class="ui-panel">
    <div class="panel-title">Loaded Mods</div>
    <label><input type="checkbox" id="mod-xaerominimap"> Xaero's Minimap (26.6.2)</label>
    <label><input type="checkbox" id="mod-xaeroworldmap"> Xaero's World Map (1.47.2)</label>
    <label><input type="checkbox" id="mod-litematica"> Litematica (0.26.3)</label>
    <div id="mods-note">Reload page to apply changes.</div>
    <button id="mods-reload" class="ui-btn primary" type="button">Reload</button>
  </div>
  <button id="file-toggle" class="ui-btn" type="button">File</button>
  <div id="file-panel" class="ui-panel">
    <div class="panel-title">Local Storage</div>
    <div class="file-label">Connected Folder</div>
    <div id="file-path" class="file-path-box">Not connected</div>
    <label class="file-sync-row">
      <span>Sync Interval (s)</span>
      <input id="file-sync-time" class="file-input" type="number" min="5" step="1" value="30">
    </label>
    <div class="file-actions">
      <button id="file-connect" class="ui-btn primary" type="button">Connect Folder</button>
      <button id="file-sync-now" class="ui-btn" type="button">Sync Now</button>
      <button id="file-disconnect" class="ui-btn" type="button">Disconnect</button>
    </div>
    <div id="file-status"></div>
  </div>
</div>
<div id="fs-overlay">
  <div id="fs-modal">
    <div class="fs-modal-title">Local Persistent Storage</div>
    <p>Link a local folder to automatically save and restore your worlds + settings.</p>
    <div id="fs-overlay-msg"></div>
    <div class="fs-modal-actions">
      <button id="fs-overlay-connect" class="ui-btn primary" type="button">Connect Local Folder</button>
      <div class="fs-modal-sub">
        <button id="fs-overlay-later" class="ui-btn" type="button">Not Now</button>
        <button id="fs-overlay-never" class="ui-btn ghost" type="button">Don't Show Again</button>
      </div>
    </div>
  </div>
</div>
<script type="module">
// main.js by its content hash (build.json): a cache that kept an older one
// would pair it with this build's game.
const files = await fetch("build.json", { cache: "no-store" }).then((r) => r.json()).catch(() => ({}));
await import(files["main.js"] ? `./main.js?v=${files["main.js"]}` : "./main.js");
</script>
</body>
</html>
